<html>
    <head>
        <style>
.firm{
    width:750px;
    height:450px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius:10px;
background-color: azure;
flex-direction: column;
margin: auto 20%;

}
.numberfirm{
   width:590px;
    height:40px;
    display: flex;
    justify-content: space-around;
    align-items: center;

   
}
#btn{
    width: 80%;
    height:60px;
    background-color: rgb(24, 245, 245);
    border-radius:15px;
    margin: 20px;
    padding:20px;
    outline: none;
    border: none;
    font-size:2em;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
}
input{
    width:80%;
    height: 25px;
    padding: 15px;
}
.hh{
    width:80%;
    height: 25px;
    font-weight: bold;
    font-size: 25px;
    text-align:left;
    display: flex;
    justify-content:stretch;
    align-items: start;
}
#btn:hover{
    background-color: aqua;
    transform: scale(1.01);
}

        </style>
    </head>
    <body>
<div class="firm">
    <h1>Tip Calculator</h1>
    <h4>Enter the bill amount and tip percentage to calculate the total.</h4>
  
    <div class="numberfirm">
    <label for="firstnumber">Bill amount:</label>
    <input type="text"  id="firstnumber"/>
    </div>
    <div class="numberfirm">
    <label for="scondnumber"> Tip percentage:</label>
    <input type="number"  id="scondnumber"/>
      </div>
      <button id="btn">Calculate</button>
      <label for="result" id="hh"></label>
      <span id="result" class="hh">Total:</span>
</div>

<script>
let firstnumber=document.getElementById("firstnumber");
let scondnumber=document.getElementById("scondnumber");
let btn=document.getElementById("btn");
let result=document.getElementById("result");

btn.addEventListener("click",function(){
   
let firstrevalue=Number(firstnumber.value);
let secondrevalue=Number(scondnumber.value);
if(isNaN(firstrevalue)){
  
    result.style.backgroundColor="red";
      return;
}
let bothresult="Total:" + (firstrevalue + ( firstrevalue*secondrevalue)/100);
result.innerHTML=bothresult;
});

</script>
</body>
</html>
